# 每個 Pull Request 與 main 的更新都要通過：自動測試、官方更新包檢查 (SHA-256、簽章、格式)
# 搭配分支保護把這個檢查設為「必須通過」，沒通過的就不能合併
name: 檢查

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 自動測試
        run: npm test
      - name: 官方更新包檢查
        run: node tools/publish-pack.js --check

  # 瀏覽器測試：用真的 Chromium 操作工具 (更新包信任、上傳對應、收回與返回、AI 傳輸、完整流程、主管核可)
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝 Playwright 與 Chromium
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 瀏覽器測試
        run: |
          # 測試資料改用英文檔名 (中文路徑在選擇檔案時會失敗)
          cp "samples/excel/試用資料_含錯誤.xlsx" "$RUNNER_TEMP/dirty.xlsx"
          export SAMPLE="$RUNNER_TEMP/dirty.xlsx"
          fail=0
          for t in t03-packs t11-upload t12-close t13-ai-transmit t14-e2e t15-approval; do
            echo "::group::$t"
            node "tests/security/$t.js" || { echo "::error::$t 沒有通過"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
